databases:
  - name: stormy-license-db
    databaseName: stormy_licenses
    user: stormy_admin
    plan: free

services:
  - type: web
    name: stormy-license-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stormy-license-db
          property: connectionString
      - key: ADMIN_SECRET
        generateValue: true
      - key: TOKEN_SECRET
        generateValue: true
